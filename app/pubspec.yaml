name: fermata
description: "Fermata - a sheet music keeping and practice app"
publish_to: 'none'

version: 1.0.3+4d fix issues #12/#13)
# Obtainium compares a release tag against the installed versionName to decide
# whether an update exists, and Android compares versionCode to decide whether
# an install is an upgrade. Bump the `+N` on every release; see
# docs/obtainium.md.

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # PDF engine. Used through pdfrx_engine's PdfPage.render(), not through
  # pdfrx's own viewer widgets, which are built on the separate material_ui
  # package and would clash with our Material 3 / One UI styling.
  pdfrx: ^2.6.5

  # MusicXML -> page images. Renders via crisp_notation's Bravura SMuFL font and
  # exportScoreToPng, which needs Flutter because the font and its metadata are
  # package assets that the pure-Dart crisp_notation_core cannot load itself.
  # Pinned exactly rather than ^0.7.0: this package is a week old, so a caret
  # range would let a breaking 0.x release change the APK without a commit here.
  # Code is MIT, the bundled Bravura font is OFL. See docs/musicxml-import.md.
  crisp_notation: 0.7.0

  # MIDI synthesis. Wrapped behind AudioEngine so it stays swappable.
  flutter_midi_engine: ^0.1.5

  # State management.
  flutter_riverpod: ^3.4.3

  # Persistence. The schema and repositories live in fermata_data; the app
  # supplies the native QueryExecutor via drift_flutter. sqlite3 is listed
  # directly because the app names CommonDatabase in the per-connection setup
  # callback that enables foreign keys.
  drift_flutter: ^0.3.1
  sqlite3: ^3.0.0

  # Backup archives.
  archive: ^4.0.9

  # Import pipeline.
  file_picker: ^13.1.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Shared domain layer.
  fermata_core:
    path: ../packages/fermata_core
  fermata_data:
    path: ../packages/fermata_data

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

# `android` names the launcher resource set to generate. It was "true" here,
# which made the tool emit mipmap-*/true.png — and Android rejects `true` as a
# resource name (reserved Java keyword), so the APK would not build. The name
# below matches what AndroidManifest.xml references.
flutter_launcher_icons:
  android: "ic_launcher_new"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1E1E2C"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  # Obtainium's app config. Single source of truth for the `obtainium://` deep
  # link built in `update/obtainium_app.dart`; docs/obtainium.md points here
  # rather than repeating the JSON.
  assets:
    - assets/distribution/obtainium_config.json
